name: 🐞 Bug report/バグ報告
description: Create a bug report to help us improve
title: "[Bug]: "
labels: [ bug ]
assignees:
  -
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please fill the form in English/日本語!
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Current Behavior
      description: A concise description of what you're experiencing.
      placeholder: |
        When I do <X>, <Y> happens and I see the error message attached below:
        ```...```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
      placeholder: When I do <X>, <Z> should happen instead.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Version
      description: |
        What version of the MCP server are you using?
        Before opening an issue please make sure you try the latest version in case a fix has already been made.
      placeholder: |
        @harurow/j-quants-doc-mcp version: 1.0.0
        Node.js version: 22.x
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. In this environment...
        2. With this config...
        3. Run '...'
        4. See error...
      render: markdown
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Filled out the Steps to Reproduce section?
      description: Please verify you have filled out the above section in regards to attaching steps or code that can reproduce your issue so that engineers can investigate. Not filling out the section will have your issue flagged as invalid and might not be investigated.
      options:
        - label: I have entered valid steps to reproduce my issue or have attached a minimally reproducible case in code that shows my issue happening; and understand that without this my issue will be flagged as invalid and closed after 30 days.
          required: true

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!
    validations:
      required: false
